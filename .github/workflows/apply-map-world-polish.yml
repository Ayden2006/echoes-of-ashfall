name: Apply world map and gameplay polish

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-game-map-core.mjs'
      - 'scripts/apply-map2-visual-depth.mjs'
      - 'scripts/apply-world-map-css.mjs'
      - '.github/workflows/apply-map-world-polish.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: world-map-polish
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
      - name: Apply terrain, map, creature and backdrop upgrades
        run: |
          node scripts/apply-game-map-core.mjs
          node scripts/apply-map2-visual-depth.mjs
          node scripts/apply-world-map-css.mjs
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Type-check game
        run: npx tsc --noEmit
      - name: Commit verified game source
        run: |
          if git diff --quiet -- app/game.tsx app/globals.css; then
            echo 'No source change needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/game.tsx app/globals.css
          git commit -m 'Build world map and deepen Sunset Shore gameplay'
          git push origin main
