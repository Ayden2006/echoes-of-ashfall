name: Apply Sunset Jackals to game source

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-sunset-jackals.mjs'
      - 'scripts/jackal-payload/**'
      - '.github/workflows/apply-sunset-jackals.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Decode and write jackal game source
        run: node scripts/apply-sunset-jackals.mjs
      - name: Commit source change
        run: |
          if git diff --quiet -- app/game.tsx; then
            echo 'No source change needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/game.tsx
          git commit -m 'Add three Sunset Jackals on Map 2 with card capture and Q deploy'
          git push origin main
