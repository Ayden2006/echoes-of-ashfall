name: Apply campaign expansion to game source

on:
  push:
    branches: [expand-story-campaign]
    paths:
      - 'scripts/apply-campaign-expansion.mjs'
      - 'scripts/campaign-inserts/**'
      - 'lib/campaign.ts'
      - '.github/workflows/apply-campaign-expansion.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out campaign branch
        uses: actions/checkout@v4
        with:
          ref: expand-story-campaign
          fetch-depth: 0
      - name: Apply campaign maps and animals to game source
        run: node scripts/apply-campaign-expansion.mjs
      - name: Commit patched game source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No source change needed.'
            exit 0
          fi
          git commit -m 'Apply maps 3-4, unique animals, and campaign story to game source'
          git push origin expand-story-campaign
