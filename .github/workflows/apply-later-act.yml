name: Apply later-act maps 5-6 to game source

on:
  push:
    branches: [gb2-later-act-maps]
    paths:
      - 'scripts/apply-campaign-expansion.mjs'
      - 'scripts/campaign-inserts/**'
      - 'app/campaign/**'
      - '.github/workflows/apply-later-act.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out later-act branch
        uses: actions/checkout@v4
        with:
          ref: gb2-later-act-maps
          fetch-depth: 0
      - name: Apply later-act maps and animals to game source
        run: node scripts/apply-campaign-expansion.mjs
      - name: Commit patched game source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No source change needed.'
            exit 0
          fi
          git commit -m 'Apply maps 5-6 later-act animals and ending to game source'
          git push origin gb2-later-act-maps
