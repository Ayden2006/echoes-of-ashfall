name: Apply Moon Night summon animation

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-moon-night-companion-animation.mjs'
      - '.github/workflows/apply-moon-night-animation.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply Moon Night animation directly to game source
        run: node scripts/apply-moon-night-companion-animation.mjs
      - name: Commit source change
        run: |
          if git diff --quiet -- app/game.tsx; then
            echo 'No source change needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/game.tsx
          git commit -m 'Add Moon Night companion deploy animation to game source'
          git push origin main
